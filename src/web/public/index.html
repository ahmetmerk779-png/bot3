<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎮 Groq AI Bot Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>⚡ MEGA BOT DASHBOARD</h1>
      <span id="connectionStatus" class="status-badge">🔄 Bağlanıyor...</span>
    </header>

    <main>
      <!-- SOL: BOT DURUMU -->
      <section class="card status-card">
        <h2>🤖 Bot Durumu</h2>
        <div id="botStatus">
          <p><strong>İsim:</strong> <span id="botName">-</span></p>
          <p><strong>Koordinat:</strong> <span id="botCoords">-</span></p>
          <p><strong>Sağlık:</strong> <span id="botHealth">-</span> ❤️</p>
          <p><strong>Yemek:</strong> <span id="botFood">-</span> 🍖</p>
          <p><strong>Meşgul:</strong> <span id="botBusy">Hayır</span></p>
          <p><strong>Hafıza:</strong> <span id="botMemory">0</span> anı</p>
        </div>
        <div class="quick-actions">
          <button onclick="sendCommand('keşfet')">🔍 Keşfet</button>
          <button onclick="sendCommand('maden aç')">⛏️ Maden Aç</button>
          <button onclick="sendCommand('ev yap')">🏠 Ev Yap</button>
          <button onclick="sendCommand('envanter')">📦 Envanter</button>
        </div>
      </section>

      <!-- ORTA: SOHBET KONSOLLU -->
      <section class="card chat-card">
        <h2>💬 Sohbet & Loglar</h2>
        <div id="chatLog" class="log-area">
          <div class="log-entry system">🟢 Dashboard bağlandı...</div>
        </div>
        <div class="chat-input">
          <input type="text" id="commandInput" placeholder="Bot'a komut yaz (örn: bana tahta kazma ver)" />
          <button onclick="sendCustomCommand()">📤 Gönder</button>
        </div>
      </section>

      <!-- SAĞ: GÖRSEL HAFIZA -->
      <section class="card vision-card">
        <h2>🖼️ Görsel Hafıza (CLIP)</h2>
        <div id="visionContainer">
          <img id="visionImage" src="/api/vision/latest" alt="Son görüntü" onerror="this.style.display='none'" />
          <p id="visionPlaceholder" style="color: #888;">Henüz görsel kaydedilmedi.</p>
        </div>
        <button onclick="refreshVision()">🔄 Yenile</button>
      </section>
    </main>

    <!-- ALT: HAFIZA ARAMA -->
    <footer class="card memory-search">
      <h3>🗄️ Hafıza Ara (Vektör DB)</h3>
      <div class="search-box">
        <input type="text" id="memoryQuery" placeholder="elmas, mağara, koordinat... ara" />
        <button onclick="searchMemory()">🔎 Ara</button>
      </div>
      <div id="memoryResults"></div>
    </footer>

    <!-- ★ YENİ: SUNUCU AYARLARI ★ -->
    <footer class="card config-card" style="margin-top:20px; border-color: #58a6ff;">
      <h3>⚙️ Sunucu Ayarları (Botu Başlat)</h3>
      <div class="config-form">
        <div class="form-group">
          <label>Sunucu IP / Adresi</label>
          <input type="text" id="configHost" placeholder="play.example.com veya 192.168.1.100" />
        </div>
        <div class="form-group">
          <label>Port</label>
          <input type="number" id="configPort" placeholder="25565" value="25565" />
        </div>
        <div class="form-group">
          <label>Bot İsmi</label>
          <input type="text" id="configUsername" placeholder="MegaBot" value="MegaBot" />
        </div>
        <div class="form-group">
          <label>Groq API Anahtarı</label>
          <input type="password" id="configApiKey" placeholder="gsk_..." />
        </div>
        <button id="startBotBtn" onclick="startBot()">🚀 Botu Başlat</button>
        <button id="stopBotBtn" onclick="stopBot()" style="background:#ff4444;">⏹️ Botu Durdur</button>
      </div>
      <div id="configStatus" style="margin-top:10px; font-size:14px; color:#ffaa00;"></div>
    </footer>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
