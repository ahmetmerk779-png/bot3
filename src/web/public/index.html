<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎮 Mega Bot Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>⚡ MEGA BOT</h1>
      <span id="connectionStatus" class="status-badge">🔄 Bağlanıyor...</span>
    </header>

    <div class="grid">
      <!-- SOL: SUNUCU AYARLARI -->
      <section class="card">
        <h2>🔌 Sunucu Bağlantısı</h2>
        <form id="connectForm">
          <label>Kullanıcı Adı</label>
          <input type="text" id="username" value="MegaBot" />
          <label>Sunucu Adresi (IP)</label>
          <input type="text" id="host" placeholder="proxy.sunucu.com" />
          <label>Port</label>
          <input type="number" id="port" value="25565" />
          <button type="submit">🔗 Bağlan</button>
        </form>
        <div id="connectionInfo" style="margin-top:10px;font-size:13px;color:#888;"></div>
      </section>

      <!-- ORTA: DURUM + KOMUT -->
      <section class="card">
        <h2>🤖 Bot Durumu</h2>
        <div id="botStatus">
          <p><strong>İsim:</strong> <span id="botName">-</span></p>
          <p><strong>Koordinat:</strong> <span id="botCoords">-</span></p>
          <p><strong>Sağlık:</strong> <span id="botHealth">-</span> ❤️</p>
          <p><strong>Yemek:</strong> <span id="botFood">-</span> 🍖</p>
          <p><strong>Meşgul:</strong> <span id="botBusy">Hayır</span></p>
        </div>
        <hr />
        <h3>🗣️ Doğal Dil Komut</h3>
        <div class="chat-input">
          <input type="text" id="commandInput" placeholder="bana tahta kazma ver, ev yap, maden aç..." />
          <button onclick="sendCommand()">📤 Gönder</button>
        </div>
        <div id="chatLog" class="log-area">
          <div class="log-entry system">🟢 Dashboard hazır...</div>
        </div>
      </section>

      <!-- SAĞ: GÖRSEL -->
      <section class="card">
        <h2>🖼️ Görsel Hafıza</h2>
        <img id="visionImage" src="/api/vision/latest" alt="Son görüntü" onerror="this.style.display='none'" />
        <button onclick="refreshVision()" style="margin-top:10px;">🔄 Yenile</button>
      </section>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="dashboard.js"></script>
</body>
  </html>
