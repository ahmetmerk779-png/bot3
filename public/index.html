<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mineflayer Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #121212; color: #e0e0e0; padding: 15px; }
    h1, h2 { color: #fff; margin-bottom: 12px; }
    .container { display: grid; grid-template-columns: 1fr; gap: 15px; max-width: 1200px; margin: 0 auto; }
    @media(min-width: 768px) { .container { grid-template-columns: 1fr 1fr; } }
    .card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 15px; }
    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; }
    input { width: 100%; padding: 8px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    button { background: #007bff; color: #fff; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; flex: 1; min-width: 100px; }
    button:hover { opacity: 0.9; }
    button.danger { background: #dc3545; }
    button.warning { background: #ffc107; color: #000; }
    button.success { background: #28a745; }
    iframe { width: 100%; height: 350px; border: 1px solid #333; border-radius: 4px; background: #000; }
    .status-box { background: #111; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 13px; max-height: 150px; overflow-y: auto; }
  </style>
</head>
<body>

  <h1>🎮 Mineflayer Kontrol Paneli</h1>

  <div class="container">
    
    <!-- Bot Bağlantı Paneli -->
    <div class="card">
      <h2>🚀 Bot Başlat</h2>
      <div class="form-group">
        <label>Sunucu Adresi (Host)</label>
        <input type="text" id="host" value="localhost">
      </div>
      <div class="form-group">
        <label>Port</label>
        <input type="number" id="port" value="25565">
      </div>
      <div class="form-group">
        <label>Kullanıcı Adı</label>
        <input type="text" id="username" value="Bot1">
      </div>
      <div class="form-group">
        <label>Sürüm</label>
        <input type="text" id="version" value="1.21.11">
      </div>
      <div class="form-group">
        <label>Bot Sayısı</label>
        <input type="number" id="count" value="1">
      </div>
      <div class="btn-group">
        <button class="success" onclick="spawnBot()">Başlat</button>
        <button class="danger" onclick="stopAll()">Tümünü Durdur</button>
      </div>
    </div>

    <!-- Hızlı Eylemler & Komutlar -->
    <div class="card">
      <h2>⚡ Kontrol Komutları</h2>
      
      <div class="form-group">
        <label>Sohbet Mesajı / Komut</label>
        <input type="text" id="chatMsg" placeholder="/login şifre veya mesaj...">
      </div>
      <button onclick="sendChat()">Gönder</button>

      <hr style="border-color: #333; margin: 15px 0;">

      <div class="form-group">
        <label>Takip Et (Oyuncu Adı)</label>
        <input type="text" id="followUser" placeholder="Oyuncu adı">
      </div>
      <button onclick="followUser()">Takip Et</button>

      <hr style="border-color: #333; margin: 15px 0;">

      <div class="btn-group">
        <button class="warning" onclick="startAfk()">Anti-AFK Başlat</button>
        <button class="danger" onclick="stopAfk()">Anti-AFK Durdur</button>
        <button onclick="clearTrash()">Çöp Temizle</button>
        <button onclick="equipArmor()">Zırh Giydir</button>
      </div>
    </div>

    <!-- 3D Görünüm (Prismarine Viewer Proxy) -->
    <div class="card" style="grid-column: 1 / -1;">
      <h2>👁️ 3D Canlı Görünüm</h2>
      <iframe src="/viewer" id="viewerFrame"></iframe>
      <button style="margin-top: 10px;" onclick="document.getElementById('viewerFrame').src='/viewer'">Yenile</button>
    </div>

    <!-- Bot Durumu -->
    <div class="card" style="grid-column: 1 / -1;">
      <h2>📊 Bot Durumları</h2>
      <button style="margin-bottom: 10px;" onclick="fetchStatus()">Durumu Güncelle</button>
      <div class="status-box" id="statusOutput">Aktif bot yok veya veri yüklenmedi.</div>
    </div>

  </div>

  <script>
    async function apiPost(endpoint, body = {}) {
      try {
        const res = await fetch(`/api/${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        alert(data.message || 'İşlem Başarılı');
        fetchStatus();
      } catch (err) {
        alert('Hata: ' + err.message);
      }
    }

    function spawnBot() {
      apiPost('spawn', {
        host: document.getElementById('host').value,
        port: document.getElementById('port').value,
        username: document.getElementById('username').value,
        version: document.getElementById('version').value,
        count: parseInt(document.getElementById('count').value)
      });
    }

    function stopAll() { apiPost('stop'); }
    function sendChat() { apiPost('chat', { message: document.getElementById('chatMsg').value }); }
    function followUser() { apiPost('follow', { username: document.getElementById('followUser').value }); }
    function startAfk() { apiPost('afk/start'); }
    function stopAfk() { apiPost('afk/stop'); }
    function clearTrash() { apiPost('trash/clear'); }
    function equipArmor() { apiPost('equip-armor'); }

    async function fetchStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        const box = document.getElementById('statusOutput');
        if (!data.bots || data.bots.length === 0) {
          box.innerHTML = 'Aktif bot yok.';
          return;
        }
        box.innerHTML = data.bots.map(b => 
          `🤖 <b>${b.username}</b> | Can: ${b.health} | Açlık: ${b.food} | POS: ${b.position ? `${b.position.x}, ${b.position.y}, ${b.position.z}` : 'Bilinmiyor'} | Elinde: ${b.heldItem}`
        ).join('<br>');
      } catch (e) {
        console.error(e);
      }
    }

    setInterval(fetchStatus, 5000);
  </script>
</body>
</html>
